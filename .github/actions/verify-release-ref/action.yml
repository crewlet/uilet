name: Verify the release commit
description: >-
  Fails unless the run was started by a push to main and the pushed commit is
  still on main. The release workflow runs it before building, again before
  publishing, and again before tagging and creating the GitHub release.

runs:
  using: composite
  steps:
    # A release is every merge to main, and main accepts only reviewed pull
    # requests, so being on main is what ties published bytes to reviewed code.
    # Neither npm trusted publishing nor the npm-publish environment looks at
    # which commit a run builds, so this step is the place that does.
    #
    # The trigger is checked first, so that a later edit adding another event
    # to release.yml (a manual dispatch, a tag) fails here instead of releasing
    # a commit nobody merged. The commit is then checked against main as it is
    # now, read from the GitHub API rather than from the checkout: runs queue
    # behind one another, and a commit that left main while its run waited
    # (should main ever be rewritten) must not be released afterwards. main is
    # resolved to a SHA first, so a tag or another ref named "main" cannot
    # stand in for the branch.
    - name: Verify that the run is for a push to main and that the commit is on main
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
          echo "::error::a release is made from a push to main, but this run was started by a ${GITHUB_EVENT_NAME} event for ${GITHUB_REF}"
          exit 1
        fi

        main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
        # "identical" or "ahead" means main is this commit or contains it.
        status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${main}" --jq .status)"
        case "${status}" in
          identical | ahead)
            echo "${GITHUB_SHA} is on main, which is at ${main}"
            ;;
          *)
            echo "::error::${GITHUB_SHA} is no longer on main, which is at ${main} (comparison status: ${status}). Nothing is released for a commit that left main."
            exit 1
            ;;
        esac
