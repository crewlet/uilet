# Automated dependency updates, one entry per dependency surface:
#
#   .github/workflows/*.yml   the actions CI, releases and deployments run on
#   .github/actions/*/action.yml
#                             the actions those workflows share
#   package-lock.json         every workspace's build and runtime dependencies
#   .github/deploy            the Wrangler release the Storybook deployment
#                             installs
#
# A new surface needs its entry here in the same change. Nothing reports the
# omission: a manifest with no entry never produces a pull request, which looks
# exactly like a manifest with nothing to update.
#
# Security updates are separate. They come from published advisories, are
# switched on in the repository settings rather than here, and are not held
# back by this schedule or by the cooldown below.
#
# No entry sets a `cooldown`, so a version update waits the 3 days Dependabot
# applies on its own: a version is not proposed until 3 days after its
# release. A longer wait is a `cooldown` in every entry here, and nothing
# reports its absence.
#
# Each entry pins `commit-message.prefix` to `build(deps)`, which is what the
# bumps already in `main` carry. Left unset, Dependabot infers the prefix from
# recent commit subjects, a heuristic that silently produces bare "Bump x from
# 1 to 2" subjects the day it stops matching: not the `type(scope): summary`
# form CONTRIBUTING.md asks of every commit, and not a subject that reads as
# the release note it becomes. Dependabot capitalises "Bump" itself and offers
# no way not to.

version: 2

updates:
  # "/" covers every workflow under .github/workflows, which Dependabot reads
  # whatever directory it is given; the second directory covers the composite
  # actions those workflows share, which it reads only where it is pointed at
  # an action.yml. Both pin the actions they use to commit SHAs with the
  # release in a trailing comment, and Dependabot moves the SHA and the
  # comment together.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  # One entry for the whole npm workspace: the root package-lock.json records
  # the dependencies of every workspace, and Dependabot resolves them from the
  # root.
  #
  # KEEP THE WORKSPACE INSTALLABLE BY DEPENDABOT, which runs its own Node rather
  # than the one in .nvmrc. That is why .npmrc does not set engine-strict: with
  # it, the root "engines" field (or any dependency's) refuses Dependabot's
  # install, and a bump that cannot install is a bump that never opens a pull
  # request, with nothing to report it (dependabot-core#12535 and #13741).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  # The deployment tooling is locked apart from the workspace, so the deploy
  # job installs Wrangler and nothing else. Its exact pin in package.json moves
  # with the lockfile in each update.
  - package-ecosystem: npm
    directory: "/.github/deploy"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
