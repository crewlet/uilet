name: ci

# Verifies every pull request and every push to main. Nothing here needs a
# secret or a write scope, which is what makes it safe to run for pull
# requests from forks.
#
# Actions are pinned to full commit SHAs, with the release each one
# corresponds to in a trailing comment. A tag can be moved to different code;
# a SHA cannot. Dependabot updates the SHA and the comment together, and the
# repository's "Require actions to be pinned to a full-length commit SHA"
# setting refuses a workflow that drops a pin.
#
# No job runs a dependency's install script: every install runs with
# --ignore-scripts, and nothing in the workspace needs one.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes the run for the older one. Runs on
# main are never cancelled, so every commit on main keeps a complete result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Parallel build, lint, typecheck and test jobs. See verify.yml.
  checks:
    name: checks
    uses: ./.github/workflows/verify.yml

  # The "verify" check the main ruleset requires. It always runs, because a
  # skipped job would report success, and passes only if every check passed.
  verify:
    name: verify
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to have passed
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          set -euo pipefail
          if [ "${RESULT}" != success ]; then
            echo "::error::the verification jobs finished with the result \"${RESULT}\""
            exit 1
          fi

  # The install, build, version and pack the release workflow runs, from a
  # fresh checkout, so a manifest, an exports entry, a license file or a build
  # step that only the release path exercises fails on the pull request that
  # breaks it rather than on the merge that would release it. The version
  # step also prints the version this commit would be released as. The
  # comparison with the registry is left to the release workflow: its answer
  # depends on what the registry holds at the moment, which a pull request
  # neither controls nor can change, and while a release is being published
  # it would fail every pull request that runs in that window.
  pack:
    name: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history and every tag, which the version is computed from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup-node
      - name: Install and build only the published packages
        run: node scripts/release.mjs build
      - name: Compute the release version and write it into the manifests
        run: node scripts/release.mjs version --write
      - name: Pack the published packages
        run: node scripts/release.mjs pack "${RUNNER_TEMP}/packages"

  sign-off:
    name: sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a Signed-off-by trailer on every commit in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-signoff.mjs "${BASE_SHA}" "${HEAD_SHA}"
