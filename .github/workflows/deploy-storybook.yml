name: deploy-storybook

# Builds the Storybook and deploys it to Cloudflare Pages on every push to
# main.
#
# The work is split into two jobs so that the Cloudflare credential is never
# present while the workspace's dependencies run:
#
#   build   contents: read and no secrets. Installs the workspace with no
#           install scripts, builds the Storybook (which also checks its
#           output, see scripts/check-storybook-static.mjs) and hands over
#           nothing but the static files.
#   deploy  inside the storybook environment, which holds the Cloudflare
#           secrets and admits only main. Installs Wrangler, and only Wrangler,
#           from the lockfile in .github/deploy with no install scripts, checks
#           the downloaded files again, and uploads them. The token reaches the
#           upload step alone.
#
# The Pages project is the storybook environment's CLOUDFLARE_PAGES_PROJECT
# variable, on the account named by its CLOUDFLARE_ACCOUNT_ID secret; see
# "One-time setup" in RELEASING.md for what that account may hold.

on:
  push:
    branches: [main]

permissions: {}

# Deployments run one at a time and in order, so an older build can never
# finish after a newer one and replace it.
concurrency:
  group: deploy-storybook
  cancel-in-progress: false

jobs:
  build:
    name: build the storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache, so what is deployed is built from the lockfile
      # alone and never from a cache entry an earlier run wrote.
      - uses: $/.github/actions/setup-node

      - run: npm ci --ignore-scripts
      - run: npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: apps/storybook/storybook-static
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy to Cloudflare Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: storybook
    permissions:
      contents: read
    steps:
      # The toolchain pins, the deployment manifest and lockfile, and the
      # dependency-free check script. Nothing that builds anything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /.nvmrc
            /package.json
            /.github/deploy/
            /scripts/check-storybook-static.mjs
          sparse-checkout-cone-mode: false

      - uses: $/.github/actions/setup-node

      # Wrangler and its whole dependency tree come from the committed
      # lockfile, which scripts/release.mjs check requires to resolve every
      # entry from registry.npmjs.org with a sha512 hash, so a release
      # published upstream between two deployments cannot enter this job. No
      # install script runs, and no secret is present yet.
      - name: Install Wrangler from the lockfile
        run: npm ci --ignore-scripts --prefix=.github/deploy

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-static
          path: ${{ runner.temp }}/deploy/storybook-static

      # Checked here as well as in the build, because this job, not the build
      # job, decides what is uploaded: no Pages server code or response rules,
      # and the font license beside every font directory.
      - name: Check the build before uploading it
        run: node scripts/check-storybook-static.mjs "${RUNNER_TEMP}/deploy/storybook-static"

      # The only step that holds the Cloudflare credential. It runs from a
      # directory that contains the downloaded files alone, because Wrangler
      # reads a functions directory and a Wrangler configuration file from its
      # working directory.
      - name: Deploy
        working-directory: ${{ runner.temp }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          if [ -z "${PAGES_PROJECT}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::the storybook environment needs the CLOUDFLARE_PAGES_PROJECT variable and the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; see One-time setup in RELEASING.md"
            exit 1
          fi
          "${GITHUB_WORKSPACE}/.github/deploy/node_modules/.bin/wrangler" pages deploy storybook-static \
            --project-name="${PAGES_PROJECT}" --branch=main --commit-hash="${GITHUB_SHA}"
